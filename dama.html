<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300..800&family=Black+Han+Sans&family=Do+Hyeon&family=DotGothic16&family=Gamja+Flower&family=Gugi&family=Jua&family=Single+Day&display=swap" rel="stylesheet">
    <title>명품 다마고치 계산기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Jua", sans-serif;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #826f68;
            background: radial-gradient(circle,rgba(130, 111, 104, 1) 9%, rgba(105, 97, 92, 1) 78%);
            background-image: url(./img/명품패턴.png), linear-gradient(rgba(105, 97, 92, 1));
            background-repeat: repeat; 
            background-size: 600px;
            background-blend-mode: overlay; 
        }

        .calculator {
            position: relative;
            width: 320px; 
            background-color: #3d3535; 
            padding: 35px 25px 30px 25px; 
            border-radius: 140px 140px 80px 80px;
            box-shadow: 0 15px 35px rgba(27, 9, 2, 0.8); 
            border: 2px solid #2f1e15;
            background-image: url(./img/다마고치-케이스.jpg);
        }

        .calculator::before,
        .calculator::after {
            content: "";
            position: absolute;
            top: -20px;
            width: 60px;
            height: 60px;
            background-color: #2f1e15;
            z-index: -1;
            border-radius: 50% 50% 10% 10%;
        }

        .calculator::before {
            left: 35px;
            transform: rotate(-25deg);
        }

        .calculator::after {
            right: 35px;
            transform: rotate(25deg);
        }

        #dis {
            position: relative; 
            overflow: hidden; 
            z-index: 1; 
            width: 100%;
            height: 110px; 
            background: #b3b3b3;
            background: radial-gradient(circle, rgba(179, 179, 179, 1) 0%, rgba(138, 148, 143, 1) 100%);
            color: #f8fff6;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 45px 35px 20px 45px;
            font-size: 30px; 
            font-family: "DotGothic16", sans-serif;
            font-weight: bold;
            margin-bottom: 15px;
            border-radius: 105px 105px 25px 25px; 
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.2);
            border: 2px solid #2f1e15;
        }

        #dis::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; 
            background-image: url('./img/반투명별패턴.png'); 
            background-size: 25px; 
            background-repeat: repeat;
            image-rendering: pixelated; 
            filter: grayscale(100%) contrast(150%) opacity(0.15); 
        }
        
        .outBox {
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            gap: 12px;
            background-color: rgba(214, 198, 177, 0.6); 
            padding: 20px 15px 25px 15px; 
            background-image: url(./img/반투명별패턴.png), linear-gradient(rgba(105, 97, 92, 1));
            background-repeat: repeat; 
            background-size: 50px;
            background-blend-mode: overlay; 
            border-radius: 25px 25px 55px 55px; 
        }
        
        .outBox > div {
            width: 100%;
            height: 50px; 
            background-color: #3b2f2f;
            color: #fff;
            border-radius: 10px; 
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s; 
            background-image: url(./img/초코문양.png), linear-gradient(rgba(105, 97, 92, 1));
            background-repeat: repeat; 
            background-size: 50px;
            background-blend-mode: overlay; 
        }

        .outBox > div:hover {
            filter: brightness(1.2);
        }

        .outBox .box1 { 
            background-color: #ff6b6b;
            color: #961d1d;
            grid-column: span 2; 
        }
        
        .outBox .box2 { 
            background-color: #fff786;
            color: rgb(255, 168, 6); 
            grid-column: span 2; 
        }
        
        .outBox .box3 { 
            background-color: #1b1414; 
            grid-column: span 4; 
            margin-top: 10px;
            margin-bottom: -5px;
            height: 50px;
            border-radius: 35px 35px 105px 105px; 
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div id="dis">0</div>
        
        <div class="outBox">
            <div class="box box1" data-num="clear">clear</div>
            <div class="box box2" data-num="back">back</div>

            <div class="box" data-num="7">7</div>
            <div class="box" data-num="8">8</div>
            <div class="box" data-num="9">9</div>
            <div class="box" data-num="/">÷</div>

            <div class="box" data-num="4">4</div>
            <div class="box" data-num="5">5</div>
            <div class="box" data-num="6">6</div>
            <div class="box" data-num="*">×</div>

            <div class="box" data-num="1">1</div>
            <div class="box" data-num="2">2</div>
            <div class="box" data-num="3">3</div>
            <div class="box" data-num="-">－</div>

            <div class="box" data-num="±">±</div>
            <div class="box" data-num="0">0</div>
            <div class="box" data-num=".">.</div>
            <div class="box" data-num="+">＋</div>

            <div class="box box3" data-num="=">＝</div>
        </div>
    </div>

    <script>
        const boxs = document.querySelectorAll(".box")
        const dis = document.querySelector("#dis")

        let expr = ''
        
        boxs.forEach((item) => {
            item.addEventListener("click", () => {
                let v = item.dataset.num

                if (v === "clear") {
                    expr = ''
                    dis.innerHTML = '0'
                    return
                }

                if (v === "back") {
                    expr = expr.slice(0, -1)
                    if (expr === '') {
                        dis.innerHTML = '0'
                        return
                    }
                } 
                else if (v === "±") {
                    if (expr !== "") {
                        expr = String(eval(expr) * -1)
                    }
                }
                else if (v === "=") {
                    if (expr === '' || expr.endsWith("+") || expr.endsWith("-") || expr.endsWith("*") || expr.endsWith("/")) {
                        dis.innerHTML = 'error x_x'
                        expr = ''
                        return
                    }
                    let ans = eval(expr)
                    dis.innerHTML = Number(ans).toLocaleString()
                    expr = String(ans)
                    return
                } 
                else {
                    expr += v
                }

                if (expr.includes("+")) {
                    let parts = expr.split("+")
                    let first = Number(parts[0]).toLocaleString()
                    let second = parts[1] === "" ? "" : Number(parts[1]).toLocaleString()
                    dis.innerHTML = second === "" ? first + " ＋ " : first + " ＋ " + second
                } 
                else if (expr.includes("-")) {
                    if (expr.startsWith("-") && expr.lastIndexOf("-") === 0) {
                        dis.innerHTML = expr; 
                    } else {
                        let parts = expr.split(/(?!^)-/); 
                        let first = Number(parts[0]).toLocaleString()
                        let second = parts[1] === "" ? "" : Number(parts[1]).toLocaleString()
                        dis.innerHTML = second === "" ? first + " － " : first + " － " + second
                    }
                } 
                else if (expr.includes("*")) {
                    let parts = expr.split("*")
                    let first = Number(parts[0]).toLocaleString()
                    let second = parts[1] === "" ? "" : Number(parts[1]).toLocaleString()
                    dis.innerHTML = second === "" ? first + " × " : first + " × " + second
                } 
                else if (expr.includes("/")) {
                    let parts = expr.split("/")
                    let first = Number(parts[0]).toLocaleString()
                    let second = parts[1] === "" ? "" : Number(parts[1]).toLocaleString()
                    dis.innerHTML = second === "" ? first + " ÷ " : first + " ÷ " + second
                } 
                else {
                    if (expr.includes(".")) {
                        dis.innerHTML = expr
                    } else {
                        dis.innerHTML = Number(expr).toLocaleString()
                    }
                }
            })
        })
    </script>
</body>
</html>
