<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
    <style>

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url(https://images.unsplash.com/photo-1663427929917-333d88949f7a?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NXx8JUVDJUE3JTgwJUVBJUI1JUFDJTIwJUVCJUIwJUIwJUVBJUIyJUJEJUVEJTk5JTk0JUVCJUE5JUI0fGVufDB8fDB8fHww);
            background-size: cover;
            background-position: center;
        }

        .Box {
            width: 360px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.3);
            
            border: 1px solid rgba(255,255,255,0.35);
            display: flex;
            flex-direction: column;
            padding: 28px 28px 24px;
            gap: 0;
        }

        /* 상단 : 도시명 + 날짜 */
        .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: -10px;
        }

        .city {
            font-family: 'Do Hyeon', sans-serif;
            font-size: 35px;
            font-weight: 500;
            color: #EC6E4C;
            letter-spacing: 2px;
            text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff;
        }

        #date {
            font-family: "DotGothic16", sans-serif;
            font-weight: 400;
            font-size: 25px;
            color: rgba(255,255,255,1);
            
        }

        /* 시간 */
        #daily {
            font-family: 'Do Hyeon', sans-serif;
            font-size: 88px;
            color: #fff;
            line-height: 1;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }

        /* 구분선 */
        .line {
            width: 100%;
            height: 1px;
            background: rgba(255,255,255,0.2);
            margin-bottom: 16px;
        }

        /* 아이콘 + 정보 */
        .leftright {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .left {
            display: flex;
            justify-content: center;
        }

        #con {
            width: 150px;
            height: 150px;
        }

        .right {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        #dis {
            font-family: 'Do Hyeon', sans-serif;
            font-size: 32px;
            color: #fff;
            line-height: 1.2;
        }

        #wi {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 20px;
            color: rgba(255,255,255,1);
            font-weight: 300;
        }

        #highlow {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 25px;
            color: rgba(255,255,255,1);
            font-weight: 300;
        }

    </style>
</head>
<body>
    <div class="Box">
        <div class="top">
            <span class="city">안산시</span>
            <span id="date"></span>
        </div>

        <h2 id="daily"></h2>

        <div class="line"></div>


            <div class="left">
                <img id="con" alt="날씨아이콘"/>
            </div>
            <div class="right">
                <div id="dis"></div>
                <div id="wi"></div>
                <div id="highlow"></div>
            </div>
        </div>
    </div>

    <script>
        let dis    = document.querySelector("#dis")
        let con    = document.querySelector("#con")
        let wi     = document.querySelector("#wi")
        let daily  = document.querySelector("#daily")
        let dateEl = document.querySelector("#date")
        let highlow = document.querySelector("#highlow")
        const API_KEY  = '3caef313b5c72c8eeffaea70357e6ddd'
        const cityname = 'Ansan'

        function updateClock() {
            let date    = new Date()
            let hours   = date.getHours()   < 10 ? "0" + date.getHours()   : date.getHours()
            let minutes = date.getMinutes() < 10 ? "0" + date.getMinutes() : date.getMinutes()
            let month   = (date.getMonth() + 1) < 10 ? "0" + (date.getMonth() + 1) : (date.getMonth() + 1)
            let day     = date.getDate() < 10 ? "0" + date.getDate() : date.getDate()

            daily.innerHTML  = hours + ":" + minutes
            dateEl.innerHTML = date.getFullYear() + "-" + month + "-" + day
        }

        async function getWeather() {
            let res  = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${cityname}&appid=${API_KEY}&units=metric&lang=kr`)
            let data = await res.json()

            dis.innerHTML     = Math.round(data.main.temp) + "℃  " + data.weather[0].description
            con.src           = `https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`
            wi.innerHTML      = "💨 풍속 " + data.wind.speed + "m/s"
            highlow.innerHTML = "최고 " + Math.round(data.main.temp_max) + "° / 최저 " + Math.round(data.main.temp_min) + "°"

            console.log(data)
        }

        updateClock()
        setInterval(updateClock, 1000)
        getWeather()
    </script>
</body>
</html>
