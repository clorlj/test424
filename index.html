<!DOCTYPE html>
<html>
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300..800&family=Black+Han+Sans&family=Do+Hyeon&family=DotGothic16&family=Gamja+Flower&family=Grandiflora+One&family=Gugi&family=Jua&family=Noto+Sans+KR:wght@100&family=Single+Day&display=swap" rel="stylesheet">
    <meta charset="utf-8">
    <title>점심 어디서 먹지 MAP</title>
    <style>
        .search-container {
            margin-bottom: 12px;
            display: flex;
            align-items: center; /* 요소들을 수직 중앙 정렬 */
            gap: 8px;
        }

        /* 새로 추가된 로고 스타일 */
        .logo {
            width: 178px; /* 가로길이 */
            height: 45px; /* 세로길이 (1200x450 비율에 맞춤) */
            object-fit: cover; /* 이미지가 찌그러지지 않고 비율에 맞게 꽉 차게 자름 */
            object-position: center; /* 원본의 '가운데' 부분을 보여줌 (top이나 bottom으로 변경 가능) */
            border-radius: 5px; /* 테두리 살짝 둥글게 */
        }

        #keyword {
            height: 45px; /* 로고 높이에 맞춤 */
            box-sizing: border-box;
            padding: 0 12px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 400px;
            font-family: "Asta Sans", sans-serif;
        }

        .search-btn {
            height: 45px; /* 로고 높이에 맞춤 */
            box-sizing: border-box;
            padding: 0 18px;
            font-size: 15px;
            background: #3a9dff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: "Jua", sans-serif;
        }
        
        .location-btn {
            height: 45px; /* 로고 높이에 맞춤 */
            width: 45px;  /* 정사각형 버튼으로 통일 */
            box-sizing: border-box;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .location-btn img {
            width: 22px;
            height: 22px;
        }

        /* 아래부터는 기존 지도 및 마커 스타일과 동일 */
        .wrap {
            position: absolute;
            left: 0;
            bottom: 25px;
            width: 500px;
            height: 250px;
            margin-left: -250px;
            text-align: left;
            overflow: hidden;
            font-size: 16px;
            line-height: 1.6;
        }
        
        .wrap * {
            padding: 0;
            margin: 0; 
            font-family: "Asta Sans", sans-serif;
            font-weight: 400;
        }
        
        .wrap .info {
            width: 500px;
            height: 220px;
            border-radius: 8px;
            border-bottom: 2px solid #ccc;
            border-right: 1px solid #ccc;
            overflow: hidden;
            background: #fff;
        }
        
        .wrap .info:nth-child(1) {
            border: 0;
            box-shadow: 0px 2px 4px #888;
        }
        
        .info .title {
            padding: 10px 0 0 15px;
            height: 45px;
            background: #3a9dff; 
            color: #fff; 
            border-bottom: 1px solid #ddd;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
        }
        
        .title .rating {
            color: #ffe000;
            font-size: 20px;
            margin-left: 8px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .info .close {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #888;
            width: 17px;
            height: 17px;
            background: url('https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/overlay_close.png');
            background-size: cover;
        }
        
        .info .close:hover {
            cursor: pointer;
        }
        
        .info .body {
            position: relative;
            overflow: hidden;
            padding: 15px;
        }
        
        .info .desc {
            position: relative;
            margin: 0 0 0 160px;
            height: 140px;
        }
        
        .desc .ellipsis {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-bottom: 3px;
        }
        
        .desc .jibun {
            font-size: 14px;
            color: #888;
            margin-bottom: 6px;
        }
        
        .desc .comment {
            font-size: 14px;
            color: #ff5252;
            font-weight: bold;
            margin-bottom: 10px;
            padding: 4px;
            background: #fdf0f0;
            border-radius: 4px;
            display: inline-block;
        }

        .info .img {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 140px;
            height: 140px;
            border: 1px solid #ddd;
            color: #888;
            overflow: hidden;
            border-radius: 4px;
        }
        
        .info:after {
            content: '';
            position: absolute;
            margin-left: -12px;
            left: 50%;
            bottom: 18px;
            width: 22px;
            height: 12px;
            background: url('https://cdn.sayun.studio/boottent/files/assets/ezenas/photo/photo_22edcd69-a1ff-4a02-8ada-dc034f6a5ebe.jpg');
            background-size: cover;
        }
        
        .info .link {
            color: #3a9dff;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
        }
        
        .info .link:hover {
            text-decoration: underline;
        }
    </style>
</head>

for (var i = 0; i < markerData.length; i++) {
    var marker = new kakao.maps.Marker({
        map: map,
        position: markerData[i].latlng
    });
    
    markersArray.push(marker);

    if (markerData[i].content !== '') {
        (function(marker, content) {
            kakao.maps.event.addListener(marker, 'click', function() {
                overlay.setContent(content);
                overlay.setPosition(marker.getPosition());
                overlay.setMap(map);
            });
        })(marker, markerData[i].content);
    }
}

function openEzenOverlay() {
    if (markersArray.length > 0) {
        var ezenMarker = markersArray[0]; 
        var ezenContent = markerData[0].content;
        
        map.setCenter(ezenMarker.getPosition());
        
        overlay.setContent(ezenContent);
        overlay.setPosition(ezenMarker.getPosition());
        overlay.setMap(map);
    }
}

function searchPlaces() {
    var keyword = document.getElementById('keyword').value;
    if (!keyword.replace(/^\s+|\s+$/g, '')) {
        alert('키워드를 입력해주세요.');
        return false;
    }
    ps.keywordSearch(keyword, placesSearchCB);
}

function placesSearchCB(data, status, pagination) {
    if (status === kakao.maps.services.Status.OK) {
        var bounds = new kakao.maps.LatLngBounds();
        for (var i = 0; i < data.length; i++) {
            var searchMarker = new kakao.maps.Marker({
                map: map,
                position: new kakao.maps.LatLng(data[i].y, data[i].x)
            });
            bounds.extend(new kakao.maps.LatLng(data[i].y, data[i].x));
        }       
        map.setBounds(bounds);
    } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
        alert('검색 결과가 존재하지 않습니다.');
    } else if (status === kakao.maps.services.Status.ERROR) {
        alert('검색 중 오류가 발생했습니다. 다시 시도해주세요.');
    }
}

function closeOverlay() {
    overlay.setMap(null);
