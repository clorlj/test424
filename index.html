<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>칠판 낙서장</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300..800&family=Black+Han+Sans&family=Do+Hyeon&family=DotGothic16&family=Gaegu&family=Gamja+Flower&family=Grandiflora+One&family=Gugi&family=Jua&family=Noto+Sans+KR:wght@100&family=Single+Day&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./reset.css" >
    <style>
        #container {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative; 
        }

        #toolbar {
            width: 100%;
            height: 70px;
            background-color: #744d37;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        #toolbar div * {
            color: rgb(255, 255, 255);
            font-weight: bold;
            margin-right: 10px;
        }

        #toolbar button {
            border: none;
            background-color: #333;
            font-weight: bold;
            color: white;
            padding: 5px 20px;
            cursor: pointer;
        }

        #nameInput {
            padding: 5px 10px;
            border: none;
            outline: none;
            border-radius: 4px;
        }

        #canvas {
            background-color: #255938; 
            background-image: url('https://blog.kakaocdn.net/dna/cmseu8/btq6Z9KJYXo/AAAAAAAAAAAAAAAAAAAAAJ1luNmhHJ240C2OYRHWfJFK3JPMgT6dyWEsIkGCHGYw/img.jpg?credential=yqXZFxpELC7KVnFOS48ylbz2pIh7yKj8&expires=1782831599&allow_ip=&allow_referer=&signature=4Ct4zIYTvz0uRhNgsiQxOIpBUio%3D');
            /* background-size: cover; */ 
            /* background-position: center; */
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24'><text y='20' font-size='20'>✏️</text></svg>") 0 20, auto;
        }

        #noisy-list {
            position: absolute;
            bottom: 150px;
            right: 90px;
            color: white;
            font-family: "Gaegu", sans-serif;
            font-size: 32px;
            text-align: center;
            
        }

        #noisy-list .title {
            border-bottom: 2px solid white;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
       <div id="container">
            <div id="toolbar">
                <div>
                    <label for="strokeColor">색상</label>
                    <input type="color" id="strokeColor" value="#000" />

                    <label for="lwidth">선굵기</label>
                    <input type="number" id="lwidth" value="2" min="1" max="50" />
                </div>

                <button id="reset">지우기</button>
                <button id="downfile">다운로드</button>
                
                <input type="text" id="nameInput" placeholder="이름 입력하기" />
                <button id="addNameBtn">추가</button>
            </div>
            
            <canvas id="canvas"></canvas>

            <div id="noisy-list">
                <div class="title">떠든 사람</div>
                <div id="nameContainer"></div>
            </div>
       </div>

      <script>
            const canvas = document.querySelector("canvas");
            const toolbar = document.getElementById("toolbar");
            const nameInput = document.getElementById("nameInput");
            const nameContainer = document.getElementById("nameContainer");
            const addNameBtn = document.getElementById("addNameBtn"); // 추가 버튼 변수 생성

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - toolbar.offsetHeight;

            let canvasOffsetX = canvas.offsetLeft;
            let canvasOffsetY = canvas.offsetTop;

            let isDrawing = false;

            let startX;
            let startY;
            let lineWidth = 2;

            const ctx = canvas.getContext("2d");

            toolbar.addEventListener("change", function(e){
                if(e.target.id === "strokeColor"){
                    ctx.strokeStyle = e.target.value;
                }

                if(e.target.id === 'lwidth'){
                    lineWidth = e.target.value;
                }
            });

            canvas.addEventListener("mousedown", function(e){
                isDrawing = true;
                startX = e.clientX;
                startY = e.clientY;
            });

            canvas.addEventListener("mousemove", function(e){
                if(!isDrawing) return;
                ctx.lineWidth = lineWidth;
                ctx.lineCap = 'round';
                ctx.lineTo(e.clientX, e.clientY - canvasOffsetY);
                ctx.stroke();
            });

            canvas.addEventListener("mouseup", function(){
                isDrawing = false;
                ctx.beginPath();
            });

            toolbar.addEventListener("click", function(e){
                if(e.target.id === "reset"){
                    ctx.clearRect(0,0,canvas.width, canvas.height);
                }
            });

            toolbar.addEventListener("click", function(e){
                if(e.target.id === "downfile"){
                    let link = document.createElement("a");
                    link.download = "drawing.png"; 
                    link.href = canvas.toDataURL("image/png");
                    link.click();
                }
            });

            function addNoisyPerson() {
                const nameValue = nameInput.value.trim();
                if (nameValue !== "") {
                    const newName = document.createElement("div");
                    newName.textContent = nameValue;
                    nameContainer.appendChild(newName);
                    
                    nameInput.value = ""; 
                    nameInput.focus(); 
                }
            }

            addNameBtn.addEventListener("click", addNoisyPerson);

      </script>
</body>
</html>
